[project]
name = "ragshield"
version = "0.1.0"
description = "Minimal LangGraph RAG app with portable trust/security layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "litellm>=1.51.0",
  "langfuse>=2.0.0",
  "weaviate-client>=4.9.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pandas>=2.2.0",
  "ragas>=0.1.13",
  "datasets>=2.20.0",
  "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
